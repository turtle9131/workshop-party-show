<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0d0b1e">
  <meta name="robots" content="noindex">
  <title>🎤 사회자 리모컨</title>
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=31">
  <style>
    .rstatus { flex: none; padding: 6px 10px; font-size: 13px; font-weight: 800; text-align: center; }
    .rstatus.ok { color: var(--ok); }
    .rstatus.bad { background: rgba(255, 92, 92, .2); color: #ffb3b3; }
    .rbar { flex: none; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 8px 8px; }
    .rteam { border: 2px solid; border-radius: 14px; padding: 6px; display: flex; flex-direction: column; gap: 6px; align-items: stretch; background: rgba(0, 0, 0, .25); }
    .rteam .top { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; padding: 0 4px; }
    .rteam .nm { font-weight: 800; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .rteam .sc { font-family: var(--title); font-size: 34px; line-height: 1; }
    .rteam .bt { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; }
    .rteam .bt button { min-height: 46px; border-radius: 10px; border: 0; font-size: 18px; font-weight: 800; color: #fff; }
    .rteam .bt .minus { grid-column: 1 / -1; min-height: 30px; font-size: 13px; background: var(--panel); border: 1px solid var(--panel-line); }
    .rtabs { flex: none; display: flex; gap: 6px; padding: 0 8px 6px; }
    .rtabs .chip { flex: 1; padding: 8px 4px; font-size: 14px; white-space: nowrap; }
    .rpane { flex: 1; min-height: 0; overflow: auto; }
    .rpane[hidden] { display: none; }
    #ans { width: 100%; height: 100%; border: 0; background: #fff; display: block; }
    .rlist { display: flex; flex-direction: column; gap: 4px; padding: 0 8px 12px; }
    .rrow { display: grid; grid-template-columns: 2.6em 1fr auto auto auto; gap: 6px; align-items: center; padding: 6px 8px; border-radius: 10px; background: var(--panel); font-weight: 800; }
    .rrow b { font-family: var(--title); font-size: 20px; min-width: 1.6em; text-align: right; }
    .rrow button { width: 38px; height: 34px; border-radius: 8px; border: 1px solid var(--panel-line); background: rgba(255, 255, 255, .06); font-size: 18px; font-weight: 800; }
    .pick .nbtn { min-width: 0; flex: 1 1 28%; }
    .cbox { display: flex; flex-direction: column; gap: 10px; padding: 0 8px 14px; }
    .ctop { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: 800; font-size: 16px; }
    .cans { border-radius: 14px; padding: 10px 12px; background: rgba(255, 210, 63, .12); border: 2px solid var(--gold); text-align: center; }
    .cans small { display: block; color: var(--muted); font-size: 12px; font-weight: 700; }
    .cans b { display: block; font-family: var(--title); font-size: 30px; color: var(--gold); line-height: 1.2; word-break: keep-all; }
    .cans.rev { opacity: .55; }
    .cwin { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .cwin button { min-height: 54px; border: 0; border-radius: 12px; color: #fff; font-size: 17px; font-weight: 800; }
    .cgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .cgrid .btn { min-height: 46px; padding: 6px 4px; font-size: 14px; grid-column: span 2; }
    .cgrid .btn.small { grid-column: span 1; }
    .cgrid .btn.big { grid-column: 1 / -1; min-height: 56px; font-size: 19px; }
    #rtoast { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 90; background: #222; border: 1px solid var(--panel-line);
      padding: 10px 16px; border-radius: 12px; font-weight: 800; display: none; max-width: 90vw; text-align: center; }
  </style>
</head>
<body>
  <div id="status" class="rstatus">📡 연결하는 중…</div>
  <div id="bar" class="rbar"></div>
  <div class="rtabs">
    <button class="chip on" data-tab="ctl">🎮 진행</button>
    <button class="chip" data-tab="ans">📋 정답지</button>
    <button class="chip" data-tab="rank">🏅 개인</button>
    <button class="chip" id="undo">↩️ 취소</button>
  </div>
  <div class="rpane" id="pane-ctl"><div class="cbox" id="ctl"></div></div>
  <div class="rpane" id="pane-ans" hidden><iframe id="ans" title="정답지"></iframe></div>
  <div class="rpane" id="pane-rank" hidden><div class="rlist" id="rank"></div></div>
  <div id="rtoast"></div>
  <script>
    // 🎤 사회자 리모컨: 정답지를 보면서 팀 점수 + 맞힌 사람 개인 포인트를 줍니다.
    // 점수 계산·저장은 노트북 진행 화면이 하고, 이 폰은 명령만 보냅니다 (노트북 서버 전용).
    'use strict';
    const $ = (s) => document.querySelector(s);
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const TEAMC = ['var(--A)', 'var(--B)'];
    const vib = (ms) => { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) { /* 미지원 */ } };
    const ls = { get: (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* 저장 불가 */ } } };

    // 키는 QR 주소(?k=)로 받고 폰에 저장 → 다음부터는 host.html만 열어도 됨
    const qk = new URLSearchParams(location.search).get('k');
    if (qk) { ls.set('host-rk', qk); history.replaceState(null, '', location.pathname); }
    const rk = qk || ls.get('host-rk');
    let st = null, es = null, ip = Number(ls.get('host-ip')) || 1, setNo = null, toastT = null;

    function toast(m) { const t = $('#rtoast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toastT); toastT = setTimeout(() => { t.style.display = 'none'; }, 1800); }
    function status(text, ok) { const s = $('#status'); s.textContent = text; s.className = 'rstatus ' + (ok ? 'ok' : 'bad'); }

    function connect() {
      if (!rk) { status('🔑 진행 화면의 🎤 사회자 폰 QR을 찍어 주세요', false); return; }
      if (es) es.close();
      const src = es = new EventSource('/api/p/events?rk=' + encodeURIComponent(rk));
      src.onmessage = (e) => { let d; try { d = JSON.parse(e.data); } catch (err) { return; } if (d.t === 'rstate') { st = d; render(); } };
      src.onerror = () => {
        status('📡 다시 연결하는 중… (노트북과 같은 Wi-Fi인지 확인)', false);
        if (src.readyState !== 2 || es !== src) return;
        setTimeout(async () => {
          try {
            const r = await fetch(src.url, { cache: 'no-store', signal: AbortSignal.timeout ? AbortSignal.timeout(3000) : undefined });
            if (r.status === 403) return status('🔑 키가 바뀌었어요. 진행 화면 🎤 사회자 폰의 새 QR을 찍어 주세요', false);
            if (r.status === 404) status('⏳ 진행 화면에서 🎤 사회자 폰(또는 📱 폰 연결)을 열어 주세요', false);
          } catch (err) { /* 오프라인 → 다시 시도 */ }
          if (es === src) connect();
        }, 2000);
      };
    }

    async function send(body) {
      vib(30);
      try {
        const r = await fetch('/api/p/remote', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ rk, ...body }) });
        if (r.status === 409) { alert('노트북 진행 화면이 꺼져 있거나 연결이 끊겼어요.\n진행 화면을 열어 둔 상태에서 다시 눌러 주세요.'); return false; }
        if (r.status === 403) { alert('키가 바뀌었어요. 진행 화면의 🎤 사회자 폰 QR을 다시 찍어 주세요.'); return false; }
        if (!r.ok) throw new Error();
        return true;
      } catch (e) { alert('전송하지 못했어요. Wi-Fi 연결을 확인하고 다시 눌러 주세요.'); return false; }
    }

    const sc = () => (st && st.scores) || null;
    const members = (t) => (sc() ? sc().indiv.filter((x) => x.team === t) : []);
    const teamName = (t) => (sc() && sc().teams[t] ? sc().teams[t].name : (st && st.teamNames ? st.teamNames[t] : ['A팀', 'B팀'][t]));

    function render() {
      if (!st) return;
      status(st.host ? '✅ 진행 화면과 연결됨 · 누르면 TV 점수판에 바로 반영돼요' : '⚠️ 노트북 진행 화면이 꺼져 있어요 (점수를 줄 수 없음)', st.host);
      const s = sc();
      $('#bar').innerHTML = [0, 1].map((t) => `
        <div class="rteam" style="border-color:${TEAMC[t]}">
          <div class="top"><span class="nm" style="color:${TEAMC[t]}">${esc(teamName(t))}</span><span class="sc" style="color:${TEAMC[t]}">${s && s.teams[t] ? s.teams[t].score : '–'}</span></div>
          <div class="bt">${[1, 2, 3].map((n) => `<button style="background:${TEAMC[t]}" data-plus="${t}:${n}">+${n}</button>`).join('')}
            <button class="minus" data-minus="${t}">− 1점 빼기</button></div>
        </div>`).join('');
      // 정답지: 진행 화면의 문제 세트 번호를 따라감
      const set = s && s.set ? s.set : 1;
      if (set !== setNo) { setNo = set; $('#ans').src = 'answers.html?set=' + set; }
      // 개인 점수 목록
      const list = s ? s.indiv.slice().sort((a, b) => b.pts - a.pts || a.name.localeCompare(b.name, 'ko')) : [];
      let r = 0, prev = null;
      $('#rank').innerHTML = list.length ? list.map((x, i) => {
        if (x.pts !== prev) { r = i + 1; prev = x.pts; }
        const md = x.pts <= 0 ? '–' : r <= 3 ? ['🥇', '🥈', '🥉'][r - 1] : r + '위';
        return `<div class="rrow"><span>${md}</span><span style="color:${TEAMC[x.team]}">${s.leaders && s.leaders.includes(x.name) ? '👑 ' : ''}${esc(x.name)}</span>
          <button data-ind="${x.team}|-1|${esc(x.name)}">−</button><b>${x.pts}</b><button data-ind="${x.team}|1|${esc(x.name)}">＋</button></div>`;
      }).join('') : '<p class="sub" style="text-align:center;color:var(--muted)">진행 화면에서 🎲 팀 나누기를 하면 팀원이 여기에 나와요</p>';
      renderCtl();
    }

    // 🎮 진행: 진행 화면이 알려 준 버튼·정답 (노트북의 실제 버튼을 대신 누름)
    function renderCtl() {
      const c = st && st.ctl, el = $('#ctl');
      if (!c) { el.innerHTML = '<p class="sub" style="text-align:center;color:var(--muted)">진행 화면 정보를 기다리는 중…</p>'; return; }
      const short = (b) => /^\d+초$/.test(b.l); // 1초·3초 같은 짧은 버튼은 한 칸
      el.innerHTML = `
        <div class="ctop"><span>📺 ${esc(c.title)}</span>${c.q ? `<span class="pill">${esc(c.q)}</span>` : ''}</div>
        ${c.answer ? `<div class="cans ${c.revealed ? 'rev' : ''}"><small>${c.revealed ? '공개됨' : '정답 (사회자만 보여요)'}</small><b>${esc(c.answer)}</b>${c.detail ? `<small>${esc(c.detail)}</small>` : ''}</div>` : ''}
        ${c.win ? `<div class="cwin">${[0, 1].map((t) => `<button data-win="${t}" style="background:${TEAMC[t]}">${esc(teamName(t))} 정답 +${c.win.pts}</button>`).join('')}</div>` : ''}
        <div class="cgrid">${c.can.map((b) => `<button class="btn ${b.k === 'big' ? 'primary big' : short(b) ? 'small' : ''}" data-act="${esc(b.a)}" data-v="${esc(b.v)}">${esc(b.l)}</button>`).join('')}</div>
        ${!c.can.length && !c.win ? '<p class="sub" style="text-align:center;color:var(--muted)">이 화면에서는 폰으로 누를 버튼이 없어요.<br>위쪽 +1/+2/+3으로 점수만 줄 수 있어요.</p>' : ''}`;
    }

    // "누가 맞혔나요?" 창
    // onSend(who, ip): 고른 사람으로 보낼 명령 (기본: 팀 점수 +n)
    function pick(t, n, onSend, onlyLabel) {
      const mem = members(t);
      const sh = document.createElement('div'); sh.className = 'ssheet';
      const draw = () => {
        sh.innerHTML = `<div class="ssheet-in pick">
          <div class="head"><h2 style="color:${TEAMC[t]}">${esc(teamName(t))} +${n}</h2><button class="btn" data-x>✕ 취소</button></div>
          <p class="notice" style="margin:0">누가 맞혔나요? <small style="color:var(--muted)">개인 포인트</small></p>
          <div class="chips">${[1, 2, 3].map((k) => `<button class="chip ${ip === k ? 'on' : ''}" data-ip="${k}">개인 +${k}</button>`).join('')}</div>
          <div class="ngrid">${mem.map((x) => `<button class="nbtn" data-who="${esc(x.name)}">${s().leaders && s().leaders.includes(x.name) ? '👑' : ''}${esc(x.name)}<small>${x.pts}점</small></button>`).join('')
            || '<p class="sub" style="color:var(--muted)">팀원 명단이 없어요. 팀 점수만 줄 수 있어요.</p>'}</div>
          <div class="row">${mem.length ? `<button class="btn" data-all>👥 팀 전원 +${ip}</button>` : ''}<button class="btn primary" data-teamonly>${onlyLabel || `팀 점수만 +${n}`}</button></div>
        </div>`;
      };
      const s = sc;
      draw();
      sh.addEventListener('click', async (e) => {
        if (e.target === sh) return sh.remove();
        const b = e.target.closest('button'); if (!b) return;
        if (b.hasAttribute('data-x')) return sh.remove();
        if (b.dataset.ip) { ip = Number(b.dataset.ip); ls.set('host-ip', ip); return draw(); }
        let who = [];
        if (b.dataset.who !== undefined) who = [b.dataset.who];
        else if (b.hasAttribute('data-all')) who = mem.map((x) => x.name);
        else if (!b.hasAttribute('data-teamonly')) return;
        sh.remove();
        if (onSend) { if (await onSend(who, who.length ? ip : 0)) toast(`✅ ${teamName(t)} 정답${who.length ? ` · ${who.length > 3 ? '팀 전원' : who.join(', ')} +${ip}` : ''}`); return; }
        if (await send({ op: 'team', team: t, n, who, ip: who.length ? ip : 0 })) {
          toast(`✅ ${teamName(t)} +${n}${who.length ? ` · ${who.length > 3 ? '팀 전원' : who.join(', ')} +${ip}` : ''}`);
        }
      });
      document.body.appendChild(sh);
    }

    document.body.addEventListener('click', async (e) => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.tab) {
        document.querySelectorAll('[data-tab]').forEach((x) => x.classList.toggle('on', x === b));
        ['ctl', 'ans', 'rank'].forEach((k) => { $('#pane-' + k).hidden = b.dataset.tab !== k; });
        return;
      }
      if (!st) return;
      if (b.dataset.act !== undefined) { await send({ op: 'act', a: b.dataset.act, v: b.dataset.v }); return; }
      if (b.dataset.win !== undefined) {
        const t = Number(b.dataset.win), pts = st.ctl && st.ctl.win ? st.ctl.win.pts : 1;
        return pick(t, pts, (who, ipv) => send({ op: 'act', a: 'win', v: String(t), team: t, who, ip: ipv }), '정답만 (개인 포인트 없이)');
      }
      if (b.dataset.plus) { const [t, n] = b.dataset.plus.split(':').map(Number); return pick(t, n); }
      if (b.dataset.minus) { const t = Number(b.dataset.minus); if (await send({ op: 'team', team: t, n: -1, who: [], ip: 0 })) toast(`${teamName(t)} −1`); return; }
      if (b.dataset.ind) { const [t, n, ...rest] = b.dataset.ind.split('|'); await send({ op: 'indiv', team: Number(t), n: Number(n), who: [rest.join('|')] }); return; }
      if (b.id === 'undo') { if (confirm('방금 준 점수를 취소할까요?')) { if (await send({ op: 'undo' })) toast('↩️ 취소했어요'); } }
    });

    connect();
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && (!es || es.readyState === 2)) connect(); });
  </script>
</body>
</html>
