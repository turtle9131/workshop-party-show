<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>운영자 정답지</title>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
  <style>
    :root { --text: #1a1a2e; --muted: #6b6b80; --line: #e3e3ec; --accent: #7b5cff; --bg: #ffffff; --soft: #f5f4fb; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Pretendard', -apple-system, 'Malgun Gothic', sans-serif; color: var(--text); background: var(--bg); font-size: 14px; line-height: 1.45; }
    header { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line); padding: 10px 16px; }
    header h1 { margin: 0 0 6px; font-size: 20px; }
    .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .bar input { width: 70px; padding: 6px 8px; font-size: 15px; border: 1px solid var(--line); border-radius: 8px; }
    .bar button, .nav a { padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--soft); font: inherit; color: inherit; text-decoration: none; cursor: pointer; }
    .nav { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    main { padding: 8px 16px 40px; max-width: 960px; margin: 0 auto; }
    section { margin-top: 18px; break-inside: avoid-page; }
    h2 { font-size: 18px; margin: 18px 0 4px; padding-bottom: 4px; border-bottom: 2px solid var(--accent); }
    h3 { font-size: 15px; margin: 12px 0 4px; color: var(--accent); }
    .note { color: var(--muted); font-size: 12px; margin: 2px 0 6px; }
    ol { margin: 0; padding: 0; list-style: none; columns: 2; column-gap: 24px; }
    li { break-inside: avoid; display: flex; gap: 8px; padding: 3px 0; border-bottom: 1px dashed var(--line); }
    li b.n { min-width: 2.2em; color: var(--muted); font-variant-numeric: tabular-nums; }
    li small { color: var(--muted); }
    ol.wide { columns: 1; }
    @media (max-width: 600px) { ol { columns: 1; } }
    @media print {
      header { position: static; } .bar button, .nav, .bar label { display: none; }
      body { font-size: 11px; } h2 { break-after: avoid; }
    }
  </style>
</head>
<body>
  <header>
    <h1>📋 운영자 정답지</h1>
    <div class="bar">
      <label>문제 세트 번호 <input id="set" type="number" min="1" inputmode="numeric"></label>
      <button id="apply">적용</button>
      <button onclick="print()">🖨 인쇄</button>
      <span class="note">게임의 ⚙️ 설정에 있는 번호와 같아야 순서가 일치합니다.</span>
    </div>
    <nav class="nav">
      <a href="#music">🎵 노래</a><a href="#ost">🎬 OST</a><a href="#chosung">🔤 초성</a><a href="#photo">📸 사진</a><a href="#allin">🔥 올인</a>
    </nav>
  </header>
  <main id="out"></main>

  <script src="js/data.js?v=9"></script>
  <script src="js/order.js?v=9"></script>
  <script>
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const params = new URLSearchParams(location.search);
    const set = Math.max(1, parseInt(params.get('set'), 10) || 1);
    document.getElementById('set').value = set;
    document.getElementById('apply').onclick = () => { location.search = '?set=' + (parseInt(document.getElementById('set').value, 10) || 1); };

    const list = (items, wide) => `<ol class="${wide ? 'wide' : ''}">${items.map((t, i) => `<li><b class="n">${i + 1}</b><span>${t}</span></li>`).join('')}</ol>`;
    let html = `<p class="note">문제 세트 <b>${set}</b>번 · 게임 화면의 "Q 번호"와 아래 번호가 같습니다. 카테고리(필터)를 바꾸면 그 카테고리 목록을 보세요.</p>`;

    html += `<section id="music"><h2>🎵 1초 노래 퀴즈</h2>` +
      list(seededOrder(SONGS.length, 'music', set).map((k) => { const s = SONGS[k]; return `<b>${esc(s.title)}</b> <small>${esc(s.artist)} · ${s.year}</small>`; })) + '</section>';

    html += `<section id="ost"><h2>🎬 OST 퀴즈</h2>`;
    for (const f of OST_FILTERS) {
      const l = ostList(f);
      html += `<h3>${f}</h3>` + list(seededOrder(l.length, 'ost:' + f, set).map((k) => { const s = l[k]; return `<b>${esc(s.work)}</b> <small>${esc(s.song)} - ${esc(s.artist)}</small>`; }));
    }
    html += '</section>';

    html += `<section id="chosung"><h2>🔤 초성 퀴즈</h2>`;
    for (const c of CHOSUNG_CATS) {
      const l = chosungList(c);
      html += `<h3>${esc(c)}</h3>` + list(seededOrder(l.length, 'chosung:' + c, set).map((k) => `<b>${esc(l[k].w)}</b>${c === '전체' ? ` <small>${esc(l[k].c)}</small>` : ''}`));
    }
    html += '</section>';

    html += `<section id="photo"><h2>📸 확대 사진 퀴즈</h2>` +
      list(seededOrder(CELEBS.length, 'photo', set).map((k) => `<b>${esc(CELEBS[k].name)}</b>`)) + '</section>';

    html += `<section id="allin"><h2>🔥 올인 역전 퀴즈</h2>` +
      list(seededOrder(ALLIN.length, 'allin', set).map((k) => `${esc(ALLIN[k].q)}<br><b>→ ${esc(ALLIN[k].a)}</b>`), true) + '</section>';

    document.getElementById('out').innerHTML = html;
  </script>
</body>
</html>
